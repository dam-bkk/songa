version: "3.9"

# Production: Next.js web only.
# CV pipeline runs locally — not deployed to VM.
# Reverse proxy handled by shared Caddy on VM (see Caddyfile.snippet).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songa-web
    restart: unless-stopped
    ports:
      - "172.18.0.1:3010:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
