version: "3.9"

# Songa services bind to unique host ports (3010/8010).
# Reverse proxy is handled by the shared Caddy instance on this VM.
# Add Caddyfile.snippet to the shared Caddyfile — see Caddyfile.snippet.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songa-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.songa.damien.asia}
      - CV_API_URL=http://cv-api:8010
    depends_on:
      - cv-api
    networks:
      - songa

  cv-api:
    build:
      context: ./cv-pipeline
      dockerfile: Dockerfile
    container_name: songa-cv-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - cv-uploads:/app/uploads
      - cv-output:/app/output
      - cv-models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - songa

  # GPU variant — only on machines with NVIDIA GPU
  cv-api-gpu:
    extends:
      service: cv-api
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  cv-uploads:
  cv-output:
  cv-models:

networks:
  songa:
    driver: bridge
